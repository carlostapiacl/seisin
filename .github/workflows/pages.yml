# Publishes site/ to GitHub Pages.
#
# site/ and not docs/ on purpose: docs/ is markdown meant to be read on GitHub,
# and pointing Pages at it would hand those files to Jekyll, which renders them
# as a second, worse copy of the same pages. site/ is one self-contained page
# with its own copies of the GIFs, so nothing outside it has to be Pages-shaped.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces an older queued run, never a
# running one — a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One copy of each GIF lives in docs/img, because two copies of a binary
      # drift the moment one is regenerated. The site gets them at build time.
      - run: cp -R docs/img site/img
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
