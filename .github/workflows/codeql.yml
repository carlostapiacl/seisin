# CodeQL: static analysis over the source, not just the Scorecard SARIF that
# scorecard.yml already uploads. seisin is plain JavaScript (src/*.js), so one
# language and the default query suite. Findings land in the repo's Security tab.
#
# Actions are pinned to the same commit github/codeql-action already sits at in
# scorecard.yml, so there is one version of this action across the repo.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"   # weekly, off the hour so it does not stampede

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to file findings in the Security tab
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
