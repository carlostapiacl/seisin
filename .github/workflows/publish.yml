# Publishing, from CI and nowhere else, with provenance.
#
# A permission tool is a supply-chain target: whoever can publish seisin decides
# what runs as the boundary on every machine that installs it. Publishing from a
# laptop proves nothing about what was built. From here, npm records which
# workflow, commit and repository produced the tarball (--provenance), and the
# suite has to pass on both kernels first.
#
# One-time setup, by the maintainer on npmjs.com: package settings → Trusted
# publishing → GitHub Actions, repository carlostapiacl/seisin,
# workflow publish.yml. Until then the job falls back to an NPM_TOKEN secret if
# one exists, and fails loudly if neither does.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # provenance, and trusted publishing without a token

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1+, and node 22 ships
      # npm 10 — without this, publish fell back to a token that is not set and
      # failed with ENEEDAUTH even though the trusted publisher is configured.
      - name: npm that can publish through OIDC
        run: npm install -g npm@latest
      # `npm publish` runs `prepublishOnly: npm test`, and the sandbox half of
      # the suite needs the real runtime and kernel on this runner too — the
      # same setup the test job does, or every sandboxed run dies here and the
      # publish aborts even though the test matrix already passed.
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep socat
      - name: allow unprivileged user namespaces (Ubuntu 24.04+)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: install the sandbox runtime
        run: npm install -g @anthropic-ai/sandbox-runtime@$(node -p "require('./package.json').dependencies['@anthropic-ai/sandbox-runtime']")
      - run: npm ci
      # The tag has to be the version, or the provenance points at a commit that
      # does not say what it claims to be.
      - name: tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
